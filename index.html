<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Portofolio pribadi Nuraini Dwiarti">
    <meta name="author" content="Nuraini Dwiarti">

    <title>Nuraini Dwiarti 🌸</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

    <style>

        /* =========================================================
           1. ROOT VARIABLES
        ========================================================= */

        :root {
            --green-dark: #183c2b;
            --green: #397354;
            --green-light: #8fb89d;
            --green-soft: #dcebdd;

            --cream: #faf8f1;
            --cream-dark: #f0eee4;

            --white: #ffffff;

            --pink: #e8bfc5;
            --pink-soft: #f6e6e8;

            --brown: #695b4d;
            --text: #27332d;
            --text-light: #6d786f;

            --border: rgba(24, 60, 43, 0.12);

            --shadow:
                0 15px 40px rgba(24, 60, 43, 0.08);

            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;

            --transition: 0.3s ease;
        }


        /* =========================================================
           2. DARK MODE VARIABLES
        ========================================================= */

        body.dark {
            --green-dark: #d8eadc;
            --green: #8fc3a1;
            --green-light: #6e9b7e;
            --green-soft: #263d30;

            --cream: #111914;
            --cream-dark: #19231d;

            --white: #1b261f;

            --pink: #d69ba5;
            --pink-soft: #3b292d;

            --brown: #c7b9a9;
            --text: #edf5ef;
            --text-light: #b6c4ba;

            --border: rgba(216, 234, 220, 0.12);

            --shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }


        /* =========================================================
           3. RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            font-family: inherit;
        }


        /* =========================================================
           4. GENERAL
        ========================================================= */

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        section {
            padding: 100px 0;
            scroll-margin-top: 80px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 7px 14px;

            border-radius: 999px;

            background: var(--green-soft);
            color: var(--green-dark);

            font-size: 0.8rem;
            font-weight: 700;

            margin-bottom: 15px;
        }

        .section-title {
            font-family: "Playfair Display", serif;

            font-size: clamp(2rem, 4vw, 3rem);

            color: var(--green-dark);

            line-height: 1.2;

            margin-bottom: 20px;
        }

        .section-description {
            max-width: 680px;

            color: var(--text-light);

            margin-bottom: 40px;
        }


        /* =========================================================
           5. NAVBAR
        ========================================================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 999;

            transition: var(--transition);
        }

        header.scrolled {
            background: rgba(250, 248, 241, 0.9);

            backdrop-filter: blur(15px);

            box-shadow: 0 5px 25px rgba(24, 60, 43, 0.08);
        }

        body.dark header.scrolled {
            background: rgba(17, 25, 20, 0.9);
        }

        nav {
            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            font-family: "Playfair Display", serif;

            font-size: 1.4rem;

            font-weight: 600;

            color: var(--green-dark);
        }

        .logo span {
            color: var(--pink);
        }

        .nav-links {
            display: flex;

            align-items: center;

            gap: 28px;

            list-style: none;
        }

        .nav-links a {
            color: var(--text-light);

            font-size: 0.9rem;

            font-weight: 600;

            transition: var(--transition);

            position: relative;
        }

        .nav-links a:hover {
            color: var(--green);
        }

        .nav-links a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 0;
            height: 2px;

            background: var(--green);

            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            border: 1px solid var(--border);

            border-radius: 50%;

            background: var(--white);

            color: var(--green-dark);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: var(--transition);
        }

        .icon-button:hover {
            transform: translateY(-2px);

            background: var(--green);

            color: white;
        }

        .menu-button {
            display: none;
        }


        /* =========================================================
           6. HERO
        ========================================================= */

        .hero {
            min-height: 100vh;

            display: flex;

            align-items: center;

            padding-top: 120px;

            position: relative;

            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: var(--green-soft);

            top: 50px;
            right: -170px;

            opacity: 0.8;
        }

        .hero::after {
            content: "✿";

            position: absolute;

            font-size: 8rem;

            color: var(--pink);

            opacity: 0.35;

            bottom: -30px;
            left: 4%;
        }

        .hero-grid {
            display: grid;

            grid-template-columns: 1.1fr 0.9fr;

            gap: 70px;

            align-items: center;
        }

        .hero-small {
            color: var(--green);

            font-size: 0.95rem;

            font-weight: 700;

            margin-bottom: 15px;
        }

        .hero-title {
            font-family: "Playfair Display", serif;

            font-size: clamp(3.2rem, 8vw, 6rem);

            line-height: 0.98;

            color: var(--green-dark);

            margin-bottom: 25px;
        }

        .hero-title em {
            color: var(--green);

            font-weight: 500;
        }

        .hero-description {
            color: var(--text-light);

            max-width: 550px;

            font-size: 1.05rem;

            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }

        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 13px 20px;

            border-radius: 999px;

            font-size: 0.9rem;

            font-weight: 700;

            transition: var(--transition);
        }

        .button-primary {
            background: var(--green);

            color: white;

            box-shadow: 0 8px 20px rgba(57, 115, 84, 0.2);
        }

        .button-primary:hover {
            background: var(--green-dark);

            transform: translateY(-3px);
        }

        .button-secondary {
            border: 1px solid var(--border);

            background: var(--white);

            color: var(--green-dark);
        }

        .button-secondary:hover {
            transform: translateY(-3px);

            border-color: var(--green);
        }


        /* =========================================================
           7. HERO CARD
        ========================================================= */

        .hero-card {
            position: relative;

            display: flex;

            justify-content: center;
        }

        .profile-card {
            width: min(370px, 100%);

            background: var(--white);

            padding: 20px;

            border-radius: 35px;

            box-shadow: var(--shadow);

            transform: rotate(2deg);

            transition: var(--transition);
        }

        .profile-card:hover {
            transform: rotate(0deg) translateY(-8px);
        }

        .profile-placeholder {
            aspect-ratio: 4 / 5;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    var(--green-soft),
                    var(--pink-soft)
                );

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;

            overflow: hidden;

            position: relative;
        }

        .profile-placeholder::before {
            content: "🌿";

            font-size: 5rem;

            position: absolute;

            top: 15px;
            right: 20px;

            opacity: 0.5;
        }

        .profile-placeholder::after {
            content: "🌷";

            font-size: 4rem;

            position: absolute;

            bottom: 15px;
            left: 20px;

            opacity: 0.5;
        }

        .profile-avatar {
            width: 115px;
            height: 115px;

            border-radius: 50%;

            background: var(--white);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 3rem;

            box-shadow: var(--shadow);

            margin-bottom: 20px;
        }

        .profile-placeholder h3 {
            font-family: "Playfair Display", serif;

            font-size: 1.8rem;

            color: var(--green-dark);
        }

        .profile-placeholder p {
            color: var(--text-light);

            font-size: 0.85rem;
        }

        .floating-note {
            position: absolute;

            bottom: 20px;
            left: -20px;

            background: var(--white);

            padding: 13px 17px;

            border-radius: 16px;

            box-shadow: var(--shadow);

            font-size: 0.8rem;

            color: var(--green-dark);

            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================================================
           8. ABOUT
        ========================================================= */

        .about {
            background: var(--cream-dark);
        }

        .about-grid {
            display: grid;

            grid-template-columns: 0.8fr 1.2fr;

            gap: 60px;

            align-items: start;
        }

        .about-text {
            color: var(--text-light);

            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }

        .info-card {
            background: var(--white);

            padding: 20px;

            border-radius: var(--radius-md);

            border: 1px solid var(--border);

            transition: var(--transition);
        }

        .info-card:hover {
            transform: translateY(-4px);

            box-shadow: var(--shadow);
        }

        .info-icon {
            font-size: 1.4rem;

            margin-bottom: 7px;
        }

        .info-title {
            font-size: 0.75rem;

            color: var(--text-light);

            margin-bottom: 2px;
        }

        .info-value {
            font-weight: 700;

            color: var(--green-dark);

            font-size: 0.9rem;
        }


        /* =========================================================
           9. INTERESTS
        ========================================================= */

        .interest-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 22px;
        }

        .interest-card {
            background: var(--white);

            border: 1px solid var(--border);

            border-radius: var(--radius-lg);

            padding: 28px;

            transition: var(--transition);

            position: relative;

            overflow: hidden;
        }

        .interest-card::after {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: var(--green-soft);

            right: -40px;
            bottom: -40px;

            z-index: 0;
        }

        .interest-card > * {
            position: relative;

            z-index: 1;
        }

        .interest-card:hover {
            transform: translateY(-8px);

            box-shadow: var(--shadow);
        }

        .interest-icon {
            font-size: 2.2rem;

            margin-bottom: 15px;
        }

        .interest-card h3 {
            font-family: "Playfair Display", serif;

            color: var(--green-dark);

            font-size: 1.5rem;

            margin-bottom: 10px;
        }

        .interest-card p {
            color: var(--text-light);

            font-size: 0.9rem;

            margin-bottom: 15px;
        }

        .examples {
            font-size: 0.78rem;

            color: var(--green);

            font-weight: 600;
        }


        /* =========================================================
           10. SKILLS
        ========================================================= */

        .skills {
            background: var(--green-dark);

            color: white;
        }

        .skills .section-label {
            background: rgba(255, 255, 255, 0.1);

            color: var(--green-soft);
        }

        .skills .section-title {
            color: white;
        }

        .skills .section-description {
            color: rgba(255, 255, 255, 0.7);
        }

        .skills-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;
        }

        .skill-card {
            padding: 30px;

            border-radius: var(--radius-lg);

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.1);

            transition: var(--transition);
        }

        .skill-card:hover {
            background: rgba(255, 255, 255, 0.1);

            transform: translateY(-5px);
        }

        .skill-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .skill-name {
            font-weight: 700;
        }

        .skill-percent {
            color: var(--green-light);

            font-size: 0.8rem;
        }

        .progress {
            width: 100%;

            height: 7px;

            background: rgba(255, 255, 255, 0.1);

            border-radius: 999px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            background: var(--green-light);

            border-radius: inherit;

            width: 0;

            transition: width 1.5s ease;
        }

        .skill-description {
            margin-top: 13px;

            color: rgba(255, 255, 255, 0.65);

            font-size: 0.85rem;
        }

        .club-area {
            margin-top: 45px;
        }

        .club-area h3 {
            font-family: "Playfair Display", serif;

            font-size: 1.6rem;

            margin-bottom: 20px;
        }

        .club-list {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }

        .club-tag {
            padding: 10px 17px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 0.85rem;
        }


        /* =========================================================
           11. SCHOOL JOURNEY
        ========================================================= */

        .timeline {
            position: relative;

            max-width: 800px;

            margin-top: 45px;

            margin-left: 10px;
        }

        .timeline::before {
            content: "";

            position: absolute;

            left: 10px;

            top: 0;
            bottom: 0;

            width: 2px;

            background: var(--green-soft);
        }

        .timeline-item {
            position: relative;

            padding-left: 50px;

            padding-bottom: 45px;
        }

        .timeline-dot {
            position: absolute;

            left: 0;
            top: 5px;

            width: 22px;
            height: 22px;

            border-radius: 50%;

            background: var(--green);

            border: 5px solid var(--green-soft);
        }

        .timeline-item h3 {
            font-family: "Playfair Display", serif;

            color: var(--green-dark);

            font-size: 1.4rem;

            margin-bottom: 4px;
        }

        .timeline-status {
            display: inline-block;

            color: var(--green);

            font-size: 0.75rem;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .timeline-item p {
            color: var(--text-light);

            font-size: 0.9rem;
        }


        /* =========================================================
           12. GOALS
        ========================================================= */

        .goal-box {
            background:
                linear-gradient(
                    135deg,
                    var(--green-soft),
                    var(--pink-soft)
                );

            border-radius: 35px;

            padding: 55px;

            position: relative;

            overflow: hidden;
